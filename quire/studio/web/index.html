<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="quire-token" content="__TOKEN__" />
    <title>Quire · Book workspace</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to manuscript</a>
    <header class="appbar">
      <button class="wordmark" id="home" aria-label="Quire library">
        Quire<span class="book-mark" aria-hidden="true">▤</span>
      </button>
      <div id="book-heading"></div>
      <button class="book-tools" id="book-tools" hidden aria-label="Book tools">
        More
      </button>
      <div class="toolbar" id="toolbar"></div>
    </header>
    <div id="activity" role="status" aria-live="polite" hidden></div>
    <main id="main" tabindex="-1"></main>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="dialog">
      <form method="dialog">
        <button class="close" aria-label="Close dialog">×</button>
      </form>
      <div id="dialog-body"></div>
    </dialog>
    <input type="file" id="pdf-file" accept="application/pdf,.pdf" hidden />
  </body>
</html>
