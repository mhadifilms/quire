name: Workspace extraction and packaging

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  reference-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR and package tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fas tesseract-ocr-ara
          python -m pip install -e '.[studio]' build
      - name: Build the distributable
        run: python -m build
      - name: Generate authored reference PDFs
        run: python -m scripts.create_benchmark_corpus /tmp/quire-corpus
      - name: Measure extraction and enforce reference limits
        run: quire benchmark /tmp/quire-corpus/manifest.json --output /tmp/quire-results
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quire-reference-benchmark
          path: |
            /tmp/quire-results/benchmark.json
            /tmp/quire-results/benchmark.md
            dist/*
